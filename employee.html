<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บันทึกการใช้รถ</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>:root{--green:#11823b;--green2:#e9f8ef;--line:#d9e6dd;--text:#173022;--muted:#66766c}*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{background:linear-gradient(135deg,#086b30,#18a34a);color:#fff;border-radius:18px;padding:24px;margin-bottom:14px}.top h1{margin:0 0 6px;font-size:27px}.top p{margin:0;opacity:.92}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #123b2a0b}label{font-weight:750;font-size:14px;display:block;margin-bottom:7px}select,input{width:100%;padding:13px;border:1px solid #cbd9d0;border-radius:11px;font:inherit;background:#fff}.upload{border:2px dashed #9bc9ac;border-radius:15px;padding:22px;text-align:center;background:#f7fcf8}.preview{display:none;width:100%;max-height:330px;object-fit:contain;border-radius:12px;margin-top:12px}.ocr{background:var(--green2);border:1px solid #b7dfc4;border-radius:14px;padding:17px;margin-top:14px}.number{font-size:38px;font-weight:900;margin:4px 0}.status{font-weight:700}.btn{width:100%;border:0;border-radius:11px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;margin-top:10px}.primary{background:var(--green);color:#fff}.secondary{background:#edf2ee;color:#24452f}.success{background:#edf9f1;border:1px solid #b6dec1;color:#176532;padding:13px;border-radius:11px;margin-top:12px}.lock{display:flex;gap:9px;align-items:center;background:#f5f7f6;border-radius:10px;padding:11px;font-size:13px;color:#4f6256}.vehicleInfo,.requiredName{margin-top:10px;padding:12px;background:#f7faf8;border:1px solid var(--line);border-radius:11px}.requiredName{border:2px solid #efd48b;background:#fffaf0}.notice{font-size:13px;color:var(--muted);line-height:1.6}.hidden{display:none}</style></head><body><div class="wrap"><header class="top"><h1>🚗 บันทึกการใช้รถ</h1><p>เลือกทะเบียนรถ → ถ่ายรูปเลขไมล์ → ส่งข้อมูล</p></header><section class="card"><label>ทะเบียนรถ *</label><select id="plate"><option value="">-- เลือกรถที่ใช้งาน --</option><option value="3ฒย-2618">3ฒย-2618 — ขจร พิมพ์แมน</option><option value="4ฒง337">4ฒง337 — สมบูรณ์ บัวเข็ม</option><option value="1ฒญ-282">1ฒญ-282 — รถสำรอง</option></select><div id="vehicleInfo" class="vehicleInfo hidden"></div><div id="reserveNameBox" class="requiredName hidden"><label>ชื่อผู้ขับรถคันสำรอง * — ลงชื่อทุกครั้ง</label><input id="reserveName" placeholder="ชื่อ-นามสกุล"></div><div class="lock" style="margin-top:12px">🔒 วันและเวลาบันทึกจากระบบอัตโนมัติ</div></section><section class="card"><label>📸 รูปหน้าปัดเลขไมล์ *</label><div class="upload"><input id="photo" type="file" accept="image/*" capture="environment"><div class="notice" style="margin-top:8px">ถ่ายให้เห็นตัวเลข ODO ชัดเจน ระบบจะอ่านเลขไมล์จากรูป</div><img id="preview" class="preview"></div><div id="ocrBox" class="ocr hidden"><div class="notice">เลขไมล์ที่อ่านได้</div><div id="number" class="number">กำลังอ่าน...</div><div id="status" class="status"></div></div><button id="send" class="btn primary" onclick="submitRecord()">📤 ส่งข้อมูล</button><button class="btn secondary" onclick="clearForm()">ถ่ายรูปใหม่</button><div id="message"></div></section><section class="card"><div class="notice"><b>รอบการบันทึก</b><br>ระบบเปิดรับข้อมูลใน <b>วันที่ 1</b> และ <b>วันสุดท้ายของเดือน</b></div></section></div><script>const $=id=>document.getElementById(id);let ocrValue=null;const vehicles={'3ฒย-2618':{driver:'ขจร พิมพ์แมน',reserve:false},'4ฒง337':{driver:'สมบูรณ์ บัวเข็ม',reserve:false},'1ฒญ-282':{driver:'',reserve:true}};function isAllowedDate(){const d=new Date(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===1||d.getDate()===last}$('plate').addEventListener('change',()=>{const v=vehicles[$('plate').value],box=$('vehicleInfo'),reserve=$('reserveNameBox');if(!v){box.classList.add('hidden');reserve.classList.add('hidden');return}box.classList.remove('hidden');box.innerHTML=v.reserve?'🚗 <b>1ฒญ-282</b><br>รถสำรอง — ต้องลงชื่อผู้ขับทุกครั้ง':'🚗 <b>'+$('plate').value+'</b><br>ผู้รับผิดชอบ: <b>'+v.driver+'</b>';reserve.classList.toggle('hidden',!v.reserve)});$('photo').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').style.display='block'};r.readAsDataURL(f);await runOCR(f)});async function runOCR(file){$('ocrBox').classList.remove('hidden');$('number').textContent='กำลังอ่าน...';$('status').textContent='กำลังวิเคราะห์ภาพ';$('send').disabled=true;ocrValue=null;try{const {data}=await Tesseract.recognize(file,'eng',{logger:m=>{if(m.status==='recognizing text')$('status').textContent='กำลังอ่านภาพ '+Math.round((m.progress||0)*100)+'%'}});const nums=(data.text||'').replace(/[^0-9]/g,' ').match(/\d{4,8}/g)||[];const c=nums.map(Number).filter(n=>n>=1000&&n<=9999999);if(!c.length){$('number').textContent='อ่านไม่สำเร็จ';$('status').textContent='กรุณาถ่ายใหม่ให้เลขไมล์ชัด';return}ocrValue=c.sort((a,b)=>b-a)[0];$('number').textContent=ocrValue.toLocaleString()+' กม.';$('status').textContent='✓ อ่านเลขไมล์จากรูปแล้ว'}catch(e){$('number').textContent='อ่านไม่สำเร็จ';$('status').textContent='กรุณาถ่ายรูปใหม่'}finally{$('send').disabled=false}}function submitRecord(){if(!isAllowedDate())return alert('ระบบเปิดรับการบันทึกเฉพาะวันที่ 1 และวันสุดท้ายของเดือน');if(!$('plate').value)return alert('กรุณาเลือกทะเบียนรถ');if(!$('photo').files[0])return alert('กรุณาถ่ายรูปเลขไมล์');if(!ocrValue)return alert('ระบบยังอ่านเลขไมล์จากภาพไม่ได้ กรุณาถ่ายใหม่');const v=vehicles[$('plate').value];let driver=v.driver;if(v.reserve){driver=$('reserveName').value.trim();if(!driver)return alert('รถสำรอง 1ฒญ-282 ต้องลงชื่อผู้ขับทุกครั้ง')}const rec={id:crypto.randomUUID(),plate:$('plate').value,driver,odo:ocrValue,submittedAt:new Date().toISOString(),photoName:$('photo').files[0].name};const old=JSON.parse(localStorage.getItem('monthlyMileageRecords')||'[]');old.push(rec);localStorage.setItem('monthlyMileageRecords',JSON.stringify(old));$('message').innerHTML='<div class="success">✓ ส่งข้อมูลแล้ว<br>รถ: '+rec.plate+'<br>เลขไมล์: <b>'+ocrValue.toLocaleString()+' กม.</b></div>';$('send').disabled=true}function clearForm(){location.reload()}</script></body></html>
