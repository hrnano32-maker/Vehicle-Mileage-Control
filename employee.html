<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลงเลขไมล์ - ระบบบันทึกการใช้รถแผนกจัดส่ง</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#173022;font-family:'Noto Sans Thai',Tahoma,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:650px;margin:auto;padding:16px}.top,.card{border-radius:18px;padding:20px;margin-bottom:14px;background:#fff;border:1px solid #d9e6dd}.top{background:linear-gradient(135deg,#086b30,#18a34a);color:#fff}.top h1{margin:0 0 6px;font-weight:800}.top p{margin:0}.reminder{background:#fff7df;border:1px solid #efd48b;padding:12px;border-radius:12px;margin-bottom:14px;font-weight:700}label{font-weight:700;display:block;margin:12px 0 6px}select,input,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd9d0;border-radius:11px;font:inherit}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary{margin-top:12px;padding:14px;background:#eef8f1;border:1px solid #c8e3d0;border-radius:12px}.money{background:#f7f9fb;border:1px solid #dce5df;border-radius:12px;padding:14px;margin-top:12px}.btn{width:100%;border:0;border-radius:11px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;margin-top:10px}.primary{background:#11823b;color:#fff}.primary:disabled{opacity:.65;cursor:wait}.hidden{display:none}.muted{font-size:13px;color:#66766c;line-height:1.6}.success,.error,.warning{padding:15px;border-radius:13px;margin-top:12px}.success{background:#edf9f1;border:1px solid #b6dec1}.error{background:#fff1f1;border:1px solid #efb2b2;color:#9b1c1c}.warning{background:#fff7df;border:1px solid #efd48b;color:#7a5200}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><h1>🚗 ลงเลขไมล์</h1><p>บันทึกการใช้รถแผนกจัดส่ง</p></header><div id="reminder" class="reminder"></div><section class="card"><label>ทะเบียนรถ *</label><select id="plate"><option value="">-- เลือกรถ --</option><option value="3ฒย-2618">3ฒย-2618 — ขจร พิมพ์แมน</option><option value="4ฒง337">4ฒง337 — สมบูรณ์ บัวเข็ม</option><option value="1ฒญ-282">1ฒญ-282 — รถสำรอง</option></select><div id="reserve" class="hidden"><label>ชื่อผู้ขับรถสำรอง *</label><input id="driver" placeholder="ชื่อ-นามสกุล"></div></section><section class="card"><h2 style="margin-top:0">📍 ข้อมูลการเดินทาง</h2><div class="row"><div><label>เลขไมล์ขาออก *</label><input id="odoOut" type="number" min="0" inputmode="numeric" placeholder="เช่น 11697"></div><div><label>เลขไมล์ขาเข้า *</label><input id="odoIn" type="number" min="0" inputmode="numeric" placeholder="เช่น 11745"></div></div><div id="distance" class="summary">ระยะทางที่ใช้: <b>กรอกเลขไมล์ขาออกและขาเข้า</b></div><div id="odoCheck" class="warning hidden"></div><label>สถานที่ไป *</label><textarea id="destination" placeholder="ระบุสถานที่/เส้นทางที่ไป"></textarea></section><section class="card"><h2 style="margin-top:0">💰 ค่าใช้จ่าย</h2><div class="row"><div class="money"><label>ค่าน้ำมัน (บาท)</label><input id="fuelCost" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div><div class="money"><label>ค่าทางด่วน (บาท)</label><input id="tollCost" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div></div><div class="muted" style="margin-top:8px">ถ้าไม่มีค่าใช้จ่าย ให้กรอก 0</div><button id="send" class="btn primary">📤 ส่งข้อมูล</button><div id="msg"></div></section></div><script type="module">import{db}from'./firebase-config.js';import{collection,addDoc,getDocs,query,where,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';const $=id=>document.getElementById(id);const vehicles={'3ฒย-2618':'ขจร พิมพ์แมน','4ฒง337':'สมบูรณ์ บัวเข็ม','1ฒญ-282':''};const d=new Date(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();$('reminder').textContent=d.getDate()===1||d.getDate()===last?'📌 วันนี้เป็นวันที่กำหนดให้ลงข้อมูลเลขไมล์':'สามารถบันทึกได้ทุกวัน — ระบบจะแจ้งเตือนวันที่ 1 และวันสุดท้ายของเดือน';$('plate').onchange=()=>{$('reserve').classList.toggle('hidden',$('plate').value!=='1ฒญ-282');checkPrevious()};function updateDistance(){const out=Number($('odoOut').value),inn=Number($('odoIn').value);if(Number.isFinite(out)&&Number.isFinite(inn)&&out>=0&&inn>=out){$('distance').innerHTML='ระยะทางที่ใช้: <b>'+((inn-out).toLocaleString())+' กม.</b>'}else{$('distance').innerHTML='ระยะทางที่ใช้: <b>กรอกเลขไมล์ขาออกและขาเข้าให้ถูกต้อง</b>'}}$('odoOut').oninput=()=>{updateDistance();checkPrevious()};$('odoIn').oninput=updateDistance;async function checkPrevious(){const plate=$('plate').value,out=Number($('odoOut').value);$('odoCheck').classList.add('hidden');if(!plate||!Number.isFinite(out)||out<0)return;try{const month=d.toISOString().slice(0,7),snap=await getDocs(query(collection(db,'mileageRecords'),where('month','==',month),where('plate','==',plate)));const rows=snap.docs.map(x=>x.data()).filter(x=>Number.isFinite(Number(x.odoIn)));if(!rows.length)return;const previous=Math.max(...rows.map(x=>Number(x.odoIn)));if(out<previous){$('odoCheck').textContent='⚠️ เลขไมล์ขาออก '+out.toLocaleString()+' กม. น้อยกว่าเลขไมล์ขาเข้าครั้งล่าสุด '+previous.toLocaleString()+' กม. กรุณาตรวจสอบตัวเลข';$('odoCheck').classList.remove('hidden')}}catch(e){console.warn('ตรวจสอบเลขไมล์ก่อนหน้าไม่สำเร็จ',e)}}$('send').onclick=async()=>{try{const plate=$('plate').value,out=Number($('odoOut').value),inn=Number($('odoIn').value),destination=$('destination').value.trim(),fuel=Number($('fuelCost').value||0),toll=Number($('tollCost').value||0);if(!plate)return alert('กรุณาเลือกทะเบียนรถ');if(!Number.isFinite(out)||out<0)return alert('กรุณากรอกเลขไมล์ขาออก');if(!Number.isFinite(inn)||inn<out)return alert('⚠️ เลขไมล์ขาเข้าต้องไม่น้อยกว่าเลขไมล์ขาออก กรุณาตรวจสอบอีกครั้ง');if(!destination)return alert('กรุณาระบุสถานที่ไป');if(!Number.isFinite(fuel)||fuel<0)return alert('กรุณาตรวจสอบค่าน้ำมัน');if(!Number.isFinite(toll)||toll<0)return alert('กรุณาตรวจสอบค่าทางด่วน');let driver=vehicles[plate];if(plate==='1ฒญ-282'){driver=$('driver').value.trim();if(!driver)return alert('รถสำรองต้องลงชื่อผู้ขับทุกครั้ง')}const month=new Date().toISOString().slice(0,7),snap=await getDocs(query(collection(db,'mileageRecords'),where('month','==',month),where('plate','==',plate)));const rows=snap.docs.map(x=>x.data()).filter(x=>Number.isFinite(Number(x.odoIn)));if(rows.length){const previous=Math.max(...rows.map(x=>Number(x.odoIn)));if(out<previous){$('odoCheck').textContent='⚠️ ไม่สามารถส่งข้อมูลได้: เลขไมล์ขาออก '+out.toLocaleString()+' กม. น้อยกว่าเลขไมล์ขาเข้าครั้งล่าสุด '+previous.toLocaleString()+' กม.';$('odoCheck').classList.remove('hidden');$('odoOut').focus();return}}$('odoCheck').classList.add('hidden');$('send').disabled=true;$('send').textContent='กำลังส่งข้อมูล...';const now=new Date();await addDoc(collection(db,'mileageRecords'),{plate,driver,odoOut:out,odoIn:inn,odo:inn,distanceKm:inn-out,destination,fuelCost:fuel,tollCost:toll,totalTripCost:fuel+toll,submittedAt:serverTimestamp(),clientSubmittedAt:now.toISOString(),month});$('msg').innerHTML='<div class="success">✓ ส่งข้อมูลเรียบร้อยแล้ว<br>ทะเบียน: <b>'+plate+'</b><br>เลขไมล์: <b>'+out.toLocaleString()+' → '+inn.toLocaleString()+' กม.</b><br>ระยะทาง: <b>'+((inn-out).toLocaleString())+' กม.</b></div>';$('send').textContent='ส่งข้อมูลแล้ว'}catch(e){console.error(e);$('send').disabled=false;$('send').textContent='📤 ส่งข้อมูล';$('msg').innerHTML='<div class="error"><b>ส่งข้อมูลไม่สำเร็จ</b><br>'+((e&&e.message)||e)+'</div>'}};</script></body></html>
