<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บันทึกการใช้รถ</title><style>body{margin:0;background:#f3f7f4;color:#173022;font-family:system-ui,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top,.card{border-radius:18px;padding:20px;margin-bottom:14px;background:#fff;border:1px solid #d9e6dd}.top{background:linear-gradient(135deg,#086b30,#18a34a);color:#fff}.top h1{margin:0 0 6px}.reminder{background:#fff7df;border:1px solid #efd48b;padding:12px;border-radius:12px;margin-bottom:14px;font-weight:700}label{font-weight:700;display:block;margin:12px 0 6px}select,input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd9d0;border-radius:11px;font:inherit}.upload{border:2px dashed #9bc9ac;padding:20px;border-radius:15px;text-align:center}.preview{display:none;width:100%;max-height:330px;object-fit:contain;border-radius:12px;margin-top:12px}.manual,.success{padding:15px;border-radius:13px;margin-top:12px}.manual{background:#fffaf0;border:2px solid #efd48b}.success{background:#edf9f1;border:1px solid #b6dec1}.btn{width:100%;border:0;border-radius:11px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;margin-top:10px}.primary{background:#11823b;color:#fff}.hidden{display:none}.muted{font-size:13px;color:#66766c;line-height:1.6}</style></head><body><div class="wrap"><header class="top"><h1>🚗 บันทึกการใช้รถ</h1><p>เลือกรถ → แนบรูปเลขไมล์ → กรอกเลขไมล์ → ส่งข้อมูล</p></header><div id="reminder" class="reminder"></div><section class="card"><label>ทะเบียนรถ *</label><select id="plate"><option value="">-- เลือกรถ --</option><option value="3ฒย-2618">3ฒย-2618 — ขจร พิมพ์แมน</option><option value="4ฒง337">4ฒง337 — สมบูรณ์ บัวเข็ม</option><option value="1ฒญ-282">1ฒญ-282 — รถสำรอง</option></select><div id="reserve" class="hidden"><label>ชื่อผู้ขับรถสำรอง *</label><input id="driver" placeholder="ชื่อ-นามสกุล"></div></section><section class="card"><label>📸 รูปเลขไมล์ *</label><div class="upload"><input id="photo" type="file" accept="image/*" capture="environment"><div class="muted">ถ่ายรูปเลขไมล์ให้ชัดเจน รูปจะถูกเก็บเป็นหลักฐาน</div><img id="preview" class="preview"></div><div class="manual"><label>เลขไมล์ *</label><input id="odo" type="number" min="0" inputmode="numeric" placeholder="กรอกเลขไมล์จากหน้าปัด"><div class="muted">ระบบจะไม่อ่านเลขไมล์จากรูป ตัวเลขที่กรอกจะถูกบันทึกพร้อมรูปภาพ</div></div><button id="send" class="btn primary">📤 ส่งข้อมูล</button><div id="msg"></div></section></div><script type="module">import{db,storage}from'./firebase-config.js';import{collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js';const $=id=>document.getElementById(id);const vehicles={'3ฒย-2618':'ขจร พิมพ์แมน','4ฒง337':'สมบูรณ์ บัวเข็ม','1ฒญ-282':''};const d=new Date(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();$('reminder').textContent=d.getDate()===1||d.getDate()===last?'📌 วันนี้เป็นวันที่กำหนดให้ลงข้อมูลเลขไมล์':'สามารถบันทึกได้ทุกวัน — ระบบจะแจ้งเตือนวันที่ 1 และวันสุดท้ายของเดือน';$('plate').onchange=()=>{$('reserve').classList.toggle('hidden',$('plate').value!=='1ฒญ-282')};$('photo').onchange=()=>{const f=$('photo').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').style.display='block'};r.readAsDataURL(f)};$('send').onclick=async()=>{try{const p=$('plate').value,f=$('photo').files[0],odo=Number($('odo').value);if(!p)return alert('กรุณาเลือกทะเบียนรถ');if(!f)return alert('กรุณาถ่ายรูปหรือแนบรูปเลขไมล์');if(!Number.isFinite(odo)||odo<0)return alert('กรุณากรอกเลขไมล์');let driver=vehicles[p];if(p==='1ฒญ-282'){driver=$('driver').value.trim();if(!driver)return alert('รถสำรองต้องลงชื่อผู้ขับทุกครั้ง')}$('send').disabled=true;$('send').textContent='กำลังส่ง...';const id=crypto.randomUUID(),path=`mileage/${new Date().toISOString().slice(0,10)}/${id}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const sr=ref(storage,path);await uploadBytes(sr,f,{contentType:f.type});const url=await getDownloadURL(sr);await addDoc(collection(db,'mileageRecords'),{plate,driver,odo,photoUrl:url,photoPath:path,photoName:f.name,submittedAt:serverTimestamp(),clientSubmittedAt:new Date().toISOString(),month:new Date().toISOString().slice(0,7),reminderDay:d.getDate()===1||d.getDate()===last});$('msg').innerHTML='<div class="success">✓ ส่งข้อมูลเรียบร้อยแล้ว<br>ทะเบียน: <b>'+p+'</b><br>เลขไมล์: <b>'+odo.toLocaleString()+' กม.</b></div>';$('send').textContent='ส่งข้อมูลแล้ว'}catch(e){console.error(e);$('send').disabled=false;$('send').textContent='📤 ส่งข้อมูล';alert('ส่งข้อมูลไม่สำเร็จ: '+(e.message||e))}};</script></body></html>
