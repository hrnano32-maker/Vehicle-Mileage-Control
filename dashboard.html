<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - บันทึกการใช้รถ</title><style>body{margin:0;background:#f3f6fa;color:#17212b;font-family:system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.top,.card{background:#fff;border:1px solid #dce4ed;border-radius:16px;padding:18px;margin-bottom:15px}.top{background:#123b5d;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{padding:14px;background:#f7f9fb;border:1px solid #dce4ed;border-radius:12px}.kpi b{display:block;font-size:23px;margin-top:5px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd6e2;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:750;cursor:pointer}.primary{background:#1769aa;color:#fff}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e5ebf1;text-align:left;white-space:nowrap}th{background:#f4f7fa}.photo{width:110px;height:75px;object-fit:cover;border-radius:8px;cursor:pointer}.calc{background:#eef7ff;border:1px solid #cfe2f3;padding:15px;border-radius:12px}.result{font-size:25px;font-weight:850}.ok{color:#18723c;font-weight:700}.warn{color:#9a6700;font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><h1>📊 Dashboard การใช้รถ</h1><p>ข้อมูลจากระบบ</p></header><section class="card"><div class="grid"><div><label>เดือน</label><input id="month" type="month"></div><div><label>ทะเบียนรถ</label><select id="plate"><option value="all">รถทั้งหมด</option><option>3ฒย-2618</option><option>4ฒง337</option><option>1ฒญ-282</option></select></div><div><label>ยอดน้ำมันจากบัญชี (บาท)</label><input id="cost" type="number" min="0" step="0.01"></div><div style="align-self:end"><button class="btn primary" id="load">แสดงข้อมูล</button></div></div></section><section class="card"><h2>เลขไมล์</h2><div class="grid"><div class="kpi">เลขไมล์ต้นเดือน<b id="start">-</b></div><div class="kpi">เลขไมล์สิ้นเดือน<b id="end">-</b></div><div class="kpi">ระยะทาง<b id="km">-</b></div><div class="kpi">จำนวนรายการ<b id="count">0</b></div></div><div class="table" style="margin-top:14px"><table><thead><tr><th>วันที่/เวลา</th><th>ทะเบียน</th><th>ผู้ขับ</th><th>เลขไมล์</th><th>วิธีอ่าน</th><th>รูป</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="card"><h2>⛽ ยอดน้ำมันจากบัญชีประจำเดือน</h2><p>กรอกจำนวนเงินรวมจากบัญชี แล้วกดคำนวณ</p><button class="btn primary" id="saveFuel">บันทึกยอดน้ำมันจากบัญชี</button><button class="btn primary" id="calc" style="margin-left:8px">คำนวณ</button><div class="calc" style="margin-top:14px"><div class="grid"><div>ระยะทาง<div id="rkm" class="result">-</div></div><div>ยอดน้ำมัน<div id="rcost" class="result">-</div></div><div>บาท/กม.<div id="rbpk" class="result">-</div></div><div>บาท/100 กม.<div id="rb100" class="result">-</div></div></div><p id="assessment"></p></div></section></div><script type="module">import{db}from'./firebase-config.js';import{collection,addDoc,getDocs,query,where,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';const $=x=>document.getElementById(x);const d=new Date();$('month').value=d.toISOString().slice(0,7);let currentRows=[];async function loadData(){try{const month=$('month').value,plate=$('plate').value;const q=query(collection(db,'mileageRecords'),where('month','==',month));const snap=await getDocs(q);currentRows=snap.docs.map(x=>({id:x.id,...x.data()})).filter(x=>plate==='all'||x.plate===plate).sort((a,b)=>(a.clientSubmittedAt||'').localeCompare(b.clientSubmittedAt||''));$('count').textContent=currentRows.length;$('rows').innerHTML=currentRows.map(x=>{const t=x.submittedAt?.toDate?x.submittedAt.toDate():new Date(x.clientSubmittedAt);return `<tr><td>${t.toLocaleString('th-TH')}</td><td>${x.plate}</td><td>${x.driver||'-'}</td><td><b>${Number(x.odo).toLocaleString()} กม.</b></td><td>${x.manualEntry?'<span style="color:#b42318;font-weight:700">กรอกแทน OCR</span>':'<span class="ok">OCR</span>'}</td><td>${x.photoUrl?`<a href="${x.photoUrl}" target="_blank"><img class="photo" src="${x.photoUrl}"></a>`:'-'}</td></tr>`}).join('')||'<tr><td colspan="6">ยังไม่มีข้อมูล</td></tr>';if(currentRows.length){$('start').textContent=Number(currentRows[0].odo).toLocaleString()+' กม.';$('end').textContent=Number(currentRows.at(-1).odo).toLocaleString()+' กม.';$('km').textContent=Math.max(0,currentRows.at(-1).odo-currentRows[0].odo).toLocaleString()+' กม.'}else{$('start').textContent=$('end').textContent=$('km').textContent='-'}}catch(e){alert('โหลดข้อมูลไม่สำเร็จ: '+e.message)}}$('load').onclick=loadData;$('saveFuel').onclick=async()=>{const month=$('month').value,plate=$('plate').value,cost=Number($('cost').value);if(plate==='all')return alert('กรุณาเลือกทะเบียนรถก่อนบันทึกยอดน้ำมัน');if(!month||cost<0||!Number.isFinite(cost))return alert('กรุณากรอกยอดเงินจากบัญชี');try{await addDoc(collection(db,'monthlyFuel'),{month,plate,totalBaht:cost,submittedAt:serverTimestamp()});alert('บันทึกยอดน้ำมันจากบัญชีแล้ว')}catch(e){alert('บันทึกไม่สำเร็จ: '+e.message)}};$('calc').onclick=()=>{const km=Number(($('km').textContent||'').replace(/[^0-9.]/g,'')),cost=Number($('cost').value);if(!km||!cost)return alert('กรุณาแสดงข้อมูลและกรอกยอดน้ำมันจากบัญชีก่อน');const bpk=cost/km;$('rkm').textContent=km.toLocaleString()+' กม.';$('rcost').textContent=cost.toLocaleString(undefined,{maximumFractionDigits:2})+' บาท';$('rbpk').textContent=bpk.toLocaleString(undefined,{maximumFractionDigits:2})+' บาท/กม.';$('rb100').textContent=(bpk*100).toLocaleString(undefined,{maximumFractionDigits:2})+' บาท';$('assessment').innerHTML=bpk>8?'<span class="warn">ค่าใช้จ่ายต่อกิโลเมตรสูง ควรตรวจสอบเพิ่มเติม</span>':'<span class="ok">คำนวณเรียบร้อย</span>'};loadData();</script></body></html>
