<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - บันทึกการใช้รถ</title><style>:root{--blue:#1769aa;--navy:#123b5d;--bg:#f3f6fa;--line:#dce4ed;--text:#17212b;--muted:#647487;--ok:#18723c;--warn:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#123b5d,#1769aa);color:#fff;padding:24px;border-radius:18px;margin-bottom:15px}.top h1{margin:0 0 5px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#f7f9fb;border:1px solid var(--line);padding:15px;border-radius:12px}.kpi span{color:var(--muted);font-size:13px}.kpi b{display:block;font-size:24px;margin-top:4px}select,input{padding:11px;border:1px solid #cbd6e2;border-radius:9px;font:inherit;width:100%}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e5ebf1;text-align:left;white-space:nowrap}th{background:#f4f7fa}.calc{background:#eef7ff;border:1px solid #cfe2f3;padding:15px;border-radius:12px}.result{font-size:28px;font-weight:850}.warn{color:#9a6700;font-weight:700}.ok{color:#18723c;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><h1>📊 Dashboard การใช้รถ</h1><p>ข้อมูลเลขไมล์รายเดือน และคำนวณการใช้น้ำมัน</p></header><section class="card"><div class="grid"><div><label>เดือน</label><input id="month" type="month"></div><div><label>ทะเบียนรถ</label><select id="plate"><option value="all">รถทั้งหมด</option><option>3ฒย-2618</option><option>4ฒง337</option><option>1ฒญ-282</option></select></div><div style="align-self:end"><button class="btn primary" onclick="loadData()">แสดงข้อมูล</button></div></div></section><section class="card"><h2>เลขไมล์</h2><div class="grid"><div class="kpi"><span>ต้นเดือน</span><b id="start">-</b></div><div class="kpi"><span>สิ้นเดือน</span><b id="end">-</b></div><div class="kpi"><span>ระยะทาง</span><b id="distance">-</b></div><div class="kpi"><span>จำนวนรายการ</span><b id="count">0</b></div></div><div class="table" style="margin-top:14px"><table><thead><tr><th>วันที่</th><th>ทะเบียน</th><th>ผู้ขับ</th><th>เลขไมล์</th></tr></thead><tbody id="mileage"></tbody></table></div></section><section class="card"><h2>⛽ ข้อมูลน้ำมันประจำเดือน</h2><p style="color:#647487">กรอกยอดน้ำมันของรถที่เลือก แล้วกดคำนวณ ระบบจะนำเลขไมล์ต้นเดือน/สิ้นเดือนมาเทียบให้</p><div class="grid"><div><label>ปริมาณน้ำมันรวม (ลิตร)</label><input id="liters" type="number" min="0" step="0.01" placeholder="เช่น 500"></div><div><label>จำนวนเงินรวม (บาท)</label><input id="cost" type="number" min="0" step="0.01" placeholder="เช่น 16000"></div><div><label>จำนวนครั้งที่เติม</label><input id="fills" type="number" min="0" step="1" placeholder="เช่น 12"></div><div style="align-self:end"><button class="btn primary" onclick="calculate()">คำนวณ</button></div></div><div id="calc" class="calc" style="margin-top:14px;display:none"><div class="grid"><div><span>ระยะทาง</span><div id="rKm" class="result">-</div></div><div><span>กม./ลิตร</span><div id="rKpl" class="result">-</div></div><div><span>บาท/กม.</span><div id="rBpk" class="result">-</div></div><div><span>บาท/ลิตร</span><div id="rPpl" class="result">-</div></div></div><p id="assessment"></p></div></section></div><script>const $=id=>document.getElementById(id);const key='monthlyMileageRecords';const all=()=>JSON.parse(localStorage.getItem(key)||'[]');const now=new Date();$('month').value=now.toISOString().slice(0,7);function loadData(){const month=$('month').value,plate=$('plate').value;let rows=all().filter(x=>x.submittedAt.slice(0,7)===month);if(plate!=='all')rows=rows.filter(x=>x.plate===plate);rows.sort((a,b)=>new Date(a.submittedAt)-new Date(b.submittedAt));$('count').textContent=rows.length;$('mileage').innerHTML=rows.map(x=>`<tr><td>${new Date(x.submittedAt).toLocaleString('th-TH')}</td><td>${x.plate}</td><td>${x.driver||'-'}</td><td>${Number(x.odo).toLocaleString()} กม.</td></tr>`).join('')||'<tr><td colspan="4">ยังไม่มีข้อมูล</td></tr>';if(rows.length){$('start').textContent=Number(rows[0].odo).toLocaleString()+' กม.';$('end').textContent=Number(rows.at(-1).odo).toLocaleString()+' กม.';$('distance').textContent=Math.max(0,rows.at(-1).odo-rows[0].odo).toLocaleString()+' กม.'}else{$('start').textContent=$('end').textContent=$('distance').textContent='-'}$('calc').style.display='none'}function calculate(){let s=parseFloat($('start').textContent.replace(/[^0-9.-]/g,'')),e=parseFloat($('end').textContent.replace(/[^0-9.-]/g,'')),l=+$('liters').value,c=+$('cost').value;if(!Number.isFinite(s)||!Number.isFinite(e)||e<s)return alert('ยังไม่มีเลขไมล์ต้นเดือน/สิ้นเดือนที่ใช้คำนวณ');if(l<=0||c<0)return alert('กรุณากรอกปริมาณน้ำมันและจำนวนเงิน');let km=e-s,kpl=km/l,bpk=c/km,ppl=c/l;$('rKm').textContent=km.toLocaleString(undefined,{maximumFractionDigits:1})+' กม.';$('rKpl').textContent=kpl.toLocaleString(undefined,{maximumFractionDigits:2});$('rBpk').textContent=bpk.toLocaleString(undefined,{maximumFractionDigits:2})+' บาท';$('rPpl').textContent=ppl.toLocaleString(undefined,{maximumFractionDigits:2})+' บาท';$('calc').style.display='block';$('assessment').innerHTML=kpl<6?'<span class="warn">ควรตรวจสอบตัวเลขเพิ่มเติม</span>':'<span class="ok">คำนวณเรียบร้อย</span>'}loadData();</script></body></html>
